[window]
opacity = 1
decorations = "Transparent"
option_as_alt = "Both"
# decorations_theme_variant = "Light"

[env]
ALACRITTY = "true"

[font]
size = 12

[font.normal]
family = "ZedMono Nerd Font"
style = "Regular"

[font.bold]
family = "ZedMono Nerd Font"
style = "Bold"

[font.italic]
family = "ZedMono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "ZedMono Nerd Font"
style = "Bold Italic"

[general]
import = ["~/projects/dotfiles/alacritty/active.toml"]
# import = ["~/.config/alacritty/alacritty-theme/themes/github_dark.toml"]
# import = ["~/.config/alacritty/alacritty-theme/themes/github_light.toml"]
# import = ["~/.config/alacritty/alacritty-theme/themes/flexoki-light.toml"]
